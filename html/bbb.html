<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#101419">
        <title>歪比巴卜影视</title>
        <script>
    window.WEBHOME_PAGE_OPENED_AT = Date.now();
    if (window.fongmiBridge || window.fm || window.fongmi) document.documentElement.classList.add("fm-native");
  </script>
        <style>
    :root {
      color-scheme: dark;
      --panel-rgb: 76, 88, 98;
      --panel: rgba(var(--panel-rgb), .58);
      --panel-soft: rgba(var(--panel-rgb), .44);
      --panel-strong: rgba(var(--panel-rgb), .82);
      --control: rgba(34, 43, 51, .42);
      --control-active: rgba(48, 61, 70, .58);
      --text: #f4f7fb;
      --muted: rgba(226, 234, 242, .72);
      --line: rgba(255, 255, 255, .2);
      --line-strong: rgba(255, 255, 255, .34);
      --focus-line: rgba(168, 218, 255, .72);
      --focus-line-soft: rgba(168, 218, 255, .42);
      --focus-glow: rgba(96, 165, 250, .24);
      --danger: #f09d9d;
      --radius: 8px;
      --fm-web-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: var(--fm-web-height);
      background: transparent;
      color: var(--text);
      overflow-x: hidden;
    }

    html:not(.fm-native),
    html:not(.fm-native) body {
      background-color: #1a1e24;
      background-image: radial-gradient(circle at 10% 20%, rgba(255,255,255,.03) 0%, transparent 50%);
    }

    body {
      letter-spacing: 0;
      overscroll-behavior-x: none;
    }

    body.detail-active .app {
      visibility: hidden;
      pointer-events: none;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      text-align: inherit;
      touch-action: manipulation;
    }

    img {
      display: block;
      max-width: 100%;
      background: rgba(0, 0, 0, .12);
    }

    .app {
      min-height: var(--fm-web-height);
      padding: max(12px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
      background: transparent;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      min-height: 42px;
      margin-bottom: 10px;
      padding: 0;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.15;
      font-weight: 880;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn,
    .btn,
    .chip,
    .field {
      border-radius: var(--radius);
      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      backdrop-filter: blur(12px) saturate(1.05);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .icon-btn.is-active {
      background: var(--control-active);
      border-color: var(--line-strong);
    }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 760;
      text-decoration: none;
    }

    .btn.primary {
      background: var(--control-active);
      border-color: var(--line-strong);
    }

    .search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      min-width: 0;
      margin: 0;
      position: relative;
      z-index: 20;
    }

    .search.hidden { display: none; }

    .field {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 0 12px;
      outline: none;
      font-size: 14px;
      background: var(--control);
    }

    .search .icon-btn {
      width: 42px;
      height: 42px;
      background: var(--control-active);
      border-color: var(--line-strong);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 5px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--control-active);
      border-color: var(--line-strong);
      color: var(--text);
    }

    .status {
      min-height: 38px;
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .status.show { display: flex; }

    .spinner {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.16);
      border-top-color: rgba(255,255,255,.76);
      animation: spin .85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
      min-height: 180px;
    }

    .card {
      min-width: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--text);
      text-align: left;
    }

    .thumb {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: rgba(20, 24, 28, .5);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb.fallback {
      display: grid;
      place-items: center;
      padding: 8px;
      text-align: center;
    }

    .thumb.fallback span {
      color: rgba(255,255,255,.28);
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
      word-break: break-word;
    }

    .badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      max-width: calc(100% - 12px);
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(0,0,0,.52);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 11px;
      font-weight: 820;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-body {
      min-height: 50px;
      padding: 7px;
      background: var(--panel);
    }

    .title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12px;
      font-weight: 760;
      line-height: 1.25;
      word-break: break-word;
    }

    .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      grid-column: 1 / -1;
      min-height: 120px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-radius: var(--radius);
      border: 1px dashed rgba(255, 255, 255, .22);
      background: var(--panel-soft);
      color: var(--muted);
      text-align: center;
    }

    .more {
      width: 100%;
      margin-top: 12px;
      display: none;
    }

    .more.show { display: inline-flex; }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(8px);
      padding: max(12px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
      overflow: auto;
    }

    .sheet.active {
      display: block;
    }

    .detail {
      min-height: calc(var(--fm-web-height) - 30px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-head .brand {
      min-height: 42px;
    }

    .detail-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-content: start;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .detail-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.04), transparent 60%);
      pointer-events: none;
    }

    .detail-card > * {
      position: relative;
    }

    .poster {
      width: 112px;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 14px 34px rgba(0,0,0,.26);
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.22;
      font-weight: 880;
      word-break: break-word;
    }

    .detail-summary {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .detail-tag {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .detail-extra {
      grid-column: 1 / -1;
      display: grid;
      gap: 10px;
      margin-top: 2px;
    }

    .detail-section {
      padding: 11px;
      border-radius: var(--radius);
      background: rgba(18, 24, 30, .24);
      border: 1px solid rgba(255,255,255,.12);
    }

    .detail-section-title {
      margin-bottom: 7px;
      color: var(--text);
      font-size: 12px;
      font-weight: 820;
    }

    .detail-section-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .detail-section-text p {
      margin: 0;
    }

    .detail-section-text p + p {
      margin-top: 7px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
      padding-top: 12px;
    }

    .actions .btn.primary {
      min-width: 112px;
      background: rgba(245, 249, 252, .2);
      border-color: var(--line-strong);
    }

    .episodes {
      grid-column: 1 / -1;
      margin-top: 8px;
    }

    .episodes-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--text);
    }

    .episodes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .episode-btn {
      min-width: 52px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--control);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      transition: all .16s ease;
      cursor: pointer;
    }

    .episode-btn.active {
      background: var(--control-active);
      border-color: var(--focus-line);
      color: #fff;
    }

    .toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 80;
      display: none;
      min-height: 42px;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
      box-shadow: 0 14px 34px rgba(0,0,0,.3);
    }

    .toast.show { display: flex; }

    .focusable:focus,
    button:focus,
    input:focus {
      outline: none;
      border-color: var(--focus-line);
      box-shadow: 0 0 0 1px var(--focus-line-soft), 0 10px 24px rgba(0,0,0,.24), 0 0 18px var(--focus-glow);
    }

    .card:focus {
      transform: translateY(-1px);
    }

    /* 播放器弹窗 */
    .player-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      background: #000;
      display: none;
      flex-direction: column;
    }

    .player-modal.active {
      display: flex;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0,0,0,.8);
      z-index: 101;
    }

    .player-title {
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .player-close {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.1);
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .player-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-loading {
      position: absolute;
      color: #fff;
      font-size: 14px;
    }

    @media (min-width: 560px) {
      .app, .sheet {
        padding-left: 18px;
        padding-right: 18px;
      }
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .detail-card {
        grid-template-columns: 170px minmax(0, 1fr);
        gap: 18px;
        padding: 16px;
      }
      .poster {
        width: 170px;
      }
      .detail-title {
        font-size: 24px;
      }
      .detail-extra {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
    <main class="app" id="app">
        <header class="topbar">
            <form class="search" id="searchForm" autocomplete="off">
                <input class="field focusable" id="searchInput" type="search" placeholder="搜索电影 / 剧集 / 动漫" readonly>
                <button class="icon-btn focusable" type="submit" aria-label="搜索" title="搜索">
                    <svg class="icon" viewbox="0 0 24 24">
                        <circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" />
                    </svg>
                </button>
            </form>
        </header>
        <nav class="chips" id="chips" aria-label="分类"></nav>
        <div class="status" id="status">
            <span class="spinner"></span><span id="statusText">加载中</span>
        </div>
        <section class="grid" id="grid" aria-live="polite"></section>
        <button class="btn more focusable" id="moreBtn" type="button">加载更多</button>
    </main>
    <section class="sheet" id="detailSheet" aria-hidden="true">
        <div class="detail">
            <div class="detail-head">
                <button class="icon-btn focusable" id="closeDetailBtn" type="button" aria-label="返回" title="返回">
                    <svg class="icon" viewbox="0 0 24 24">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
                <div class="brand">
                    <div>
                        <h1>详情</h1>
                        <div class="sub" id="detailSub">歪比巴卜</div>
                    </div>
                </div>
            </div>
            <div id="detailBody"></div>
        </div>
    </section>
    
    <!-- 播放器弹窗 -->
    <div class="player-modal" id="playerModal">
        <div class="player-header">
            <span class="player-title" id="playerTitle">正在播放</span>
            <button class="player-close" id="playerCloseBtn">✕</button>
        </div>
        <div class="player-container" id="playerContainer">
            <div class="player-loading" id="playerLoading">加载播放器...</div>
            <iframe class="player-iframe" id="playerIframe" style="display:none;" allowfullscreen></iframe>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
    (function () {
      "use strict";

      // ==================== 配置 ====================
      var HOST = "https://wbbb1.com";
      var PROXY = "https://corsproxy.io/?url=";
      
      // 推送接口地址（解析器）
      var PUSH_API = "https://xn--qvr2v.850088.xyz/player/?url=";
      
      // 分类配置
      var CATS = [
        {"type_id": "1", "type_name": "电影"},
        {"type_id": "2", "type_name": "剧集"},
        {"type_id": "3", "type_name": "动漫"},
        {"type_id": "4", "type_name": "综艺"}
      ];
      
      var SNAPSHOT_KEY = "wbb_state_v5";
      var PAGE_SIZE = 24;
      
      var state = {
        cat: "1",
        key: "",
        page: 1,
        items: [],
        busy: false,
        hasMore: false,
        detail: null,
        focusKey: "",
        scrollY: 0,
        playSources: [],
        playUrls: [],
        currentSource: 0,
        currentEpisode: 0
      };
      
      var toastTimer = 0;
      
      function $(id) { return document.getElementById(id); }
      
      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      
      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }
      
      function toast(text) {
        clearTimeout(toastTimer);
        $("toast").textContent = text;
        $("toast").classList.add("show");
        toastTimer = setTimeout(function () { $("toast").classList.remove("show"); }, 2400);
      }
      
      function setStatus(text, loading) {
        $("statusText").textContent = text || "";
        $("status").classList.toggle("show", !!text);
        if ($("status").querySelector(".spinner")) {
          $("status").querySelector(".spinner").style.display = loading ? "" : "none";
        }
      }
      
      // ==================== 请求封装 ====================
      function requestHtml(url) {
        var fullUrl = PROXY + encodeURIComponent(url);
        return fetch(fullUrl, {
          headers: {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
            "Referer": HOST + "/"
          }
        }).then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        });
      }
      
      // ==================== 解析播放配置 ====================
      function parsePlayerConfig(html) {
        var patterns = [
          /var\s+player_aaaa\s*=\s*(\{[^;]+\})/,
          /player_aaaa\s*=\s*(\{[^;]+\})/,
          /var\s+player_info\s*=\s*(\{[^;]+\})/
        ];
        
        for (var p = 0; p < patterns.length; p++) {
          var match = html.match(patterns[p]);
          if (match) {
            try {
              var data = JSON.parse(match[1]);
              if (data.url) {
                var url = data.url;
                if (data.encrypt === "1") url = decodeURIComponent(url);
                if (data.encrypt === "2") {
                  try { url = atob(url); } catch(e) {}
                }
                return { url: url, next: data.link_next || "", title: data.vod_name || "" };
              }
            } catch(e) {}
          }
        }
        
        var iframeMatch = html.match(/<iframe[^>]+src=["']([^"']+)["']/i);
        if (iframeMatch) return { url: iframeMatch[1], next: "", title: "" };
        
        return null;
      }
      
      // 获取真实播放地址（用于推送接口）
      function fetchRealUrl(playPageUrl) {
        var fullUrl = playPageUrl.startsWith("http") ? playPageUrl : HOST + playPageUrl;
        return requestHtml(fullUrl).then(function(html) {
          var config = parsePlayerConfig(html);
          if (config && config.url) {
            return config.url;
          }
          throw new Error("未找到播放地址");
        });
      }
      
      // ==================== 播放器弹窗 ====================
      var playerModal = $("playerModal");
      var playerIframe = $("playerIframe");
      var playerTitle = $("playerTitle");
      var playerLoading = $("playerLoading");
      
      function showPlayer(url, title) {
        playerLoading.style.display = "none";
        playerIframe.style.display = "block";
        playerIframe.src = url;
        playerTitle.textContent = title || "正在播放";
        playerModal.classList.add("active");
        document.body.style.overflow = "hidden";
      }
      
      function closePlayer() {
        playerIframe.src = "";
        playerIframe.style.display = "none";
        playerLoading.style.display = "flex";
        playerModal.classList.remove("active");
        document.body.style.overflow = "";
      }
      
      // ==================== 核心播放函数 ====================
      // 直连模式：获取真实视频地址 → 接入推送接口 → 播放
      function playWithPush(episodeUrl, title) {
        if (!episodeUrl) {
          toast("没有播放地址");
          return Promise.reject();
        }
        
        toast("正在解析播放地址...");
        
        return fetchRealUrl(episodeUrl).then(function(realUrl) {
          if (!realUrl) throw new Error("未获取到视频地址");
          
          // 构建推送接口URL
          var pushUrl = PUSH_API + encodeURIComponent(realUrl);
          console.log("推送地址:", pushUrl);
          
          // 打开播放器
          showPlayer(pushUrl, title);
          toast("播放器已加载");
          return true;
        }).catch(function(error) {
          toast("播放失败: " + error.message);
          console.error(error);
          // 备用方案：直接打开剧集链接
          var fullUrl = episodeUrl.startsWith("http") ? episodeUrl : HOST + episodeUrl;
          if (confirm("解析失败，是否直接打开播放页面？")) {
            window.open(fullUrl, "_blank");
          }
          return false;
        });
      }
      
      // ==================== 解析页面内容 ====================
      function parseVideoCard(cardHtml) {
        var div = document.createElement("div");
        div.innerHTML = cardHtml;
        var card = div.firstElementChild;
        if (!card) return null;
        
        var link = card.querySelector("a");
        var href = link ? link.getAttribute("href") : card.getAttribute("href");
        if (!href) return null;
        
        var match = href.match(/\/detail\/(\d+)\.html/);
        if (!match) return null;
        
        var titleEl = card.querySelector(".module-poster-item-title, .module-item-title");
        var title = titleEl ? titleEl.innerText.trim() : "未知";
        
        var imgEl = card.querySelector("img");
        var pic = "";
        if (imgEl) {
          pic = imgEl.getAttribute("data-original") || imgEl.getAttribute("src") || "";
          if (pic && pic.startsWith("/")) pic = HOST + pic;
        }
        
        var remarkEl = card.querySelector(".module-item-note, .module-item-text");
        var remark = remarkEl ? remarkEl.innerText.trim() : "";
        
        return {
          id: match[1],
          title: title,
          pic: pic,
          remark: remark
        };
      }
      
      function fetchHomeContent() {
        return requestHtml(HOST + "/").then(function(html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, "text/html");
          var items = [];
          var cards = doc.querySelectorAll(".module-items .module-item, .module-items a.module-poster-item");
          for (var i = 0; i < Math.min(cards.length, PAGE_SIZE); i++) {
            var item = parseVideoCard(cards[i].outerHTML);
            if (item) items.push(item);
          }
          return { list: items };
        });
      }
      
      function fetchCategoryContent(tid, pg) {
        var url = pg === 1 ? HOST + "/type/" + tid + ".html" : HOST + "/type/" + tid + "/" + pg + ".html";
        return requestHtml(url).then(function(html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, "text/html");
          var items = [];
          var cards = doc.querySelectorAll(".module-items .module-item, .module-items a.module-poster-item");
          for (var i = 0; i < cards.length; i++) {
            var item = parseVideoCard(cards[i].outerHTML);
            if (item) items.push(item);
          }
          var pageCount = 1;
          var paginationLinks = doc.querySelectorAll(".page-link, .pagination a");
          for (var i = 0; i < paginationLinks.length; i++) {
            var num = parseInt(paginationLinks[i].innerText);
            if (!isNaN(num) && num > pageCount) pageCount = num;
          }
          return { list: items, pagecount: pageCount };
        });
      }
      
      function fetchDetailContent(vodId) {
        return requestHtml(HOST + "/detail/" + vodId + ".html").then(function(html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, "text/html");
          
          var titleEl = doc.querySelector(".module-info-heading h1");
          var title = titleEl ? titleEl.innerText.trim() : "";
          
          var imgEl = doc.querySelector(".module-info-poster img");
          var pic = "";
          if (imgEl) {
            pic = imgEl.getAttribute("data-original") || imgEl.getAttribute("src") || "";
            if (pic && pic.startsWith("/")) pic = HOST + pic;
          }
          
          var descEl = doc.querySelector(".module-info-introduction-content p");
          var desc = descEl ? descEl.innerText.trim() : "";
          
          var director = "", actor = "";
          var infoItems = doc.querySelectorAll(".module-info-item");
          for (var i = 0; i < infoItems.length; i++) {
            var item = infoItems[i];
            var label = item.querySelector(".module-info-item-title");
            var content = item.querySelector(".module-info-item-content");
            if (!label || !content) continue;
            var labelText = label.innerText.trim();
            if (labelText.includes("导演")) director = content.innerText.trim();
            if (labelText.includes("主演")) actor = content.innerText.trim();
          }
          
          var playSources = [];
          var playUrls = [];
          var tabItems = doc.querySelectorAll(".module-tab-item");
          var playContainers = doc.querySelectorAll(".module-list.sort-list.tab-list");
          
          if (tabItems.length > 0 && playContainers.length === tabItems.length) {
            for (var i = 0; i < tabItems.length; i++) {
              var sourceName = tabItems[i].getAttribute("data-dropdown-value") || tabItems[i].innerText.trim();
              var episodes = [];
              var links = playContainers[i].querySelectorAll("a.module-play-list-link");
              for (var j = 0; j < links.length; j++) {
                var href = links[j].getAttribute("href");
                var name = links[j].innerText.trim();
                if (href) episodes.push({ name: name, url: href });
              }
              if (episodes.length > 0) {
                playSources.push(sourceName);
                playUrls.push(episodes);
              }
            }
          } else {
            var defaultLinks = doc.querySelectorAll(".module-play-list-content a.module-play-list-link");
            if (defaultLinks.length > 0) {
              var episodes = [];
              for (var j = 0; j < defaultLinks.length; j++) {
                var href = defaultLinks[j].getAttribute("href");
                var name = defaultLinks[j].innerText.trim();
                if (href) episodes.push({ name: name, url: href });
              }
              if (episodes.length > 0) {
                playSources.push("默认线路");
                playUrls.push(episodes);
              }
            }
          }
          
          return {
            vod_id: vodId,
            vod_name: title,
            vod_pic: pic,
            vod_content: desc,
            vod_director: director,
            vod_actor: actor,
            play_from: playSources,
            play_urls: playUrls
          };
        });
      }
      
      function fetchSearchContent(key, pg) {
        var url = HOST + "/search/" + encodeURIComponent(key) + "-------------.html";
        if (pg && pg > 1) {
          url = HOST + "/search/" + encodeURIComponent(key) + "----------" + pg + "---.html";
        }
        return requestHtml(url).then(function(html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, "text/html");
          var items = [];
          var cards = doc.querySelectorAll(".module-items .module-item, .module-items a.module-poster-item");
          for (var i = 0; i < cards.length; i++) {
            var item = parseVideoCard(cards[i].outerHTML);
            if (item) items.push(item);
          }
          return { list: items };
        });
      }
      
      // ==================== UI 渲染 ====================
      function renderChips() {
        $("chips").innerHTML = CATS.map(function(cat) {
          return '<button class="chip focusable' + (cat.type_id === state.cat && !state.key ? " active" : "") + '" type="button" data-cat="' + escapeAttr(cat.type_id) + '">' + escapeHtml(cat.type_name) + '</button>';
        }).join("");
      }
      
      function posterGradient(id) {
        var hue = Math.abs(parseInt(id, 10) || 0) % 360;
        return "linear-gradient(135deg,hsl(" + hue + ",36%,18%),hsl(" + ((hue + 58) % 360) + ",32%,12%))";
      }
      
      function renderCard(item) {
        var poster = item.pic ? '<img src="' + escapeAttr(item.pic) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'fallback\');this.remove();">' : "";
        var fallback = poster ? "" : '<span>' + escapeHtml(item.title.substring(0, 4)) + '</span>';
        return '<button class="card focusable" type="button" data-id="' + escapeAttr(item.id) + '" data-key="vod-' + escapeAttr(item.id) + '">' +
          '<div class="thumb' + (poster ? "" : " fallback") + '" style="background:' + posterGradient(item.id) + '">' + poster + fallback + '<div class="badge">' + escapeHtml(item.remark || "连载") + '</div></div>' +
          '<div class="card-body"><div class="title">' + escapeHtml(item.title) + '</div><div class="meta">歪比巴卜</div></div>' +
          '</button>';
      }
      
      function renderList() {
        if (!state.items.length && !state.busy) {
          $("grid").innerHTML = '<div class="empty">没有找到内容</div>';
        } else {
          $("grid").innerHTML = state.items.map(renderCard).join("");
        }
        $("moreBtn").classList.toggle("show", !!state.hasMore && !state.busy);
      }
      
      function loadList(reset) {
        if (state.busy) return Promise.resolve();
        if (reset) {
          state.page = 1;
          state.items = [];
          state.hasMore = false;
          window.scrollTo(0, 0);
        }
        state.busy = true;
        setStatus("加载中", true);
        renderList();
        
        var promise;
        if (state.key) {
          promise = fetchSearchContent(state.key, state.page);
        } else {
          promise = fetchCategoryContent(state.cat, state.page);
        }
        
        return promise.then(function(data) {
          if (reset) state.items = [];
          var known = {};
          state.items.forEach(function(item) { known[item.id] = true; });
          (data.list || []).forEach(function(item) {
            if (!known[item.id]) state.items.push(item);
          });
          state.hasMore = (data.list || []).length >= PAGE_SIZE;
          setStatus("", false);
        }).catch(function(error) {
          setStatus("", false);
          if (reset && !state.items.length) {
            $("grid").innerHTML = '<div class="empty">加载失败：' + escapeHtml(error.message || error) + '</div>';
          }
          toast("加载失败：" + (error.message || error));
        }).then(function() {
          state.busy = false;
          renderList();
          saveSnapshot();
        });
      }
      
      function loadMore() {
        if (state.busy || !state.hasMore) return;
        state.page += 1;
        loadList(false);
      }
      
      function switchCat(cat) {
        state.cat = cat;
        state.key = "";
        $("searchInput").value = "";
        renderChips();
        history.replaceState({ route: "home" }, "", "#home");
        loadList(true);
      }
      
      function doSearch(keyword) {
        keyword = String(keyword || "").trim();
        if (!keyword) return;
        state.key = keyword;
        state.cat = "1";
        renderChips();
        history.replaceState({ route: "home" }, "", "#search=" + encodeURIComponent(keyword));
        loadList(true);
      }
      
      // 详情渲染
      function renderDetail() {
        var detail = state.detail || {};
        $("detailSub").textContent = detail.vod_name || "歪比巴卜";
        
        if (detail.loading) {
          $("detailBody").innerHTML = '<div class="empty"><span class="spinner"></span>&nbsp;加载详情</div>';
          return;
        }
        if (detail.error) {
          $("detailBody").innerHTML = '<div class="empty">详情加载失败：' + escapeHtml(detail.error) + '</div>';
          return;
        }
        
        var title = detail.vod_name || "";
        var poster = detail.vod_pic || "";
        var posterHtml = poster ? '<img src="' + escapeAttr(poster) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove();">' : "";
        var director = detail.vod_director ? '<span class="detail-tag">导演：' + escapeHtml(detail.vod_director) + '</span>' : "";
        var actor = detail.vod_actor ? '<span class="detail-tag">主演：' + escapeHtml(detail.vod_actor.substring(0, 50)) + '</span>' : "";
        var descHtml = detail.vod_content ? '<section class="detail-section"><div class="detail-section-title">简介</div><div class="detail-section-text"><p>' + escapeHtml(detail.vod_content.substring(0, 300)) + '</p></div></section>' : "";
        
        // 播放源切换
        var sourceHtml = "";
        if (state.playSources.length > 1) {
          var sourceBtns = state.playSources.map(function(source, idx) {
            return '<button class="episode-btn' + (idx === state.currentSource ? " active" : "") + '" data-source-idx="' + idx + '">' + escapeHtml(source) + '</button>';
          }).join("");
          sourceHtml = '<div class="episodes"><div class="episodes-title">播放源</div><div class="episodes-list">' + sourceBtns + '</div></div>';
        }
        
        // 剧集列表
        var episodes = state.playUrls[state.currentSource] || [];
        var episodesHtml = "";
        if (episodes.length > 0) {
          var epBtns = episodes.map(function(ep, idx) {
            return '<button class="episode-btn' + (idx === state.currentEpisode ? " active" : "") + '" data-ep-idx="' + idx + '">' + escapeHtml(ep.name) + '</button>';
          }).join("");
          episodesHtml = '<div class="episodes"><div class="episodes-title">剧集列表</div><div class="episodes-list">' + epBtns + '</div></div>';
        }
        
        $("detailBody").innerHTML =
          '<article class="detail-card">' +
          '<div class="poster" style="background:' + posterGradient(detail.vod_id || "0") + '">' + posterHtml + '</div>' +
          '<div class="detail-summary">' +
          '<h2 class="detail-title">' + escapeHtml(title) + '</h2>' +
          '<div class="detail-tags">' + director + actor + '</div>' +
          '<div class="actions"><button class="btn primary focusable" id="playBtn" type="button"><svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>立即播放</button></div>' +
          '</div>' +
          (descHtml ? '<div class="detail-extra">' + descHtml + '</div>' : '') +
          sourceHtml + episodesHtml +
          '</article>';
        
        // 绑定播放源切换
        $("detailBody").querySelectorAll("[data-source-idx]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            var idx = parseInt(btn.getAttribute("data-source-idx"));
            if (!isNaN(idx)) {
              state.currentSource = idx;
              state.currentEpisode = 0;
              renderDetail();
            }
          });
        });
        
        // 绑定剧集切换（点击自动播放）
        $("detailBody").querySelectorAll("[data-ep-idx]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            var idx = parseInt(btn.getAttribute("data-ep-idx"));
            if (!isNaN(idx)) {
              state.currentEpisode = idx;
              renderDetail();
              playCurrent();
            }
          });
        });
        
        var playBtn = $("detailBody").querySelector("#playBtn");
        if (playBtn) playBtn.addEventListener("click", playCurrent);
      }
      
      function playCurrent() {
        var episodes = state.playUrls[state.currentSource] || [];
        var episode = episodes[state.currentEpisode];
        if (!episode || !episode.url) {
          toast("没有播放地址");
          return;
        }
        var title = (state.detail ? state.detail.vod_name : "") + " " + episode.name;
        playWithPush(episode.url, title);
      }
      
      function openDetail(id, options) {
        options = options || {};
        state.detail = { loading: true, vod_id: id };
        renderDetail();
        showDetail(options.skipHistory);
        
        fetchDetailContent(id).then(function(detail) {
          state.detail = detail;
          state.playSources = detail.play_from || [];
          state.playUrls = detail.play_urls || [];
          state.currentSource = 0;
          state.currentEpisode = 0;
          renderDetail();
          saveSnapshot();
        }).catch(function(error) {
          state.detail = { error: error.message || String(error), vod_id: id };
          renderDetail();
        });
      }
      
      function showDetail(skipHistory) {
        document.body.classList.add("detail-active");
        $("detailSheet").classList.add("active");
        $("detailSheet").setAttribute("aria-hidden", "false");
        if (!skipHistory && location.hash !== "#detail") {
          history.pushState({ route: "detail", id: state.detail && state.detail.vod_id }, "", "#detail");
        }
        setTimeout(function() { focusRemoteTarget($("closeDetailBtn")); }, 40);
      }
      
      function closeDetail(fromPop) {
        document.body.classList.remove("detail-active");
        $("detailSheet").classList.remove("active");
        $("detailSheet").setAttribute("aria-hidden", "true");
        state.detail = null;
        if (!fromPop && location.hash === "#detail") history.back();
        requestAnimationFrame(restoreListFocus);
      }
      
      // ==================== 状态保存 ====================
      function saveSnapshot() {
        state.scrollY = window.scrollY || 0;
        var active = document.activeElement;
        if (active && active.dataset && active.dataset.key) state.focusKey = active.dataset.key;
        var data = {
          time: Date.now(),
          cat: state.cat,
          key: state.key,
          page: state.page,
          items: state.items,
          hasMore: state.hasMore,
          scrollY: state.scrollY,
          focusKey: state.focusKey
        };
        try {
          localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(data));
        } catch (ignore) {}
      }
      
      function restoreSnapshot() {
        try {
          var text = localStorage.getItem(SNAPSHOT_KEY) || "";
          var data = JSON.parse(text);
          if (!data || Date.now() - Number(data.time || 0) > 2 * 60 * 60 * 1000) return false;
          state.cat = data.cat || "1";
          state.key = data.key || "";
          state.page = Number(data.page || 1);
          state.items = Array.isArray(data.items) ? data.items : [];
          state.hasMore = !!data.hasMore;
          state.scrollY = Number(data.scrollY || 0);
          state.focusKey = data.focusKey || "";
          $("searchInput").value = state.key;
          renderChips();
          renderList();
          setTimeout(function() {
            window.scrollTo(0, state.scrollY || 0);
            restoreListFocus();
          }, 50);
          return state.items.length > 0;
        } catch (e) {
          return false;
        }
      }
      
      // ==================== 焦点管理 ====================
      function focusRemoteTarget(target) {
        if (!target) return;
        try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); }
        var rect = target.getBoundingClientRect();
        var topLimit = 12;
        var bottomLimit = window.innerHeight - 18;
        if (rect.top < topLimit || rect.bottom > bottomLimit) target.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
      
      function isVisibleFocusable(el) {
        if (!el || !el.matches || !el.matches(".focusable,button,input")) return false;
        if (el.disabled || el.getAttribute("tabindex") === "-1") return false;
        if (el.closest("[aria-hidden='true']")) return false;
        var rect = el.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0 && getComputedStyle(el).visibility !== "hidden";
      }
      
      function focusScopeRoot() {
        if ($("detailSheet").classList.contains("active")) return $("detailSheet");
        return document;
      }
      
      function focusables() {
        return Array.prototype.slice.call(focusScopeRoot().querySelectorAll(".focusable,button,input")).filter(isVisibleFocusable);
      }
      
      function restoreListFocus() {
        var target = state.focusKey ? document.querySelector('[data-key="' + cssEscape(state.focusKey) + '"]') : null;
        if (!target) target = $("grid").querySelector(".card") || $("chips").querySelector(".chip.active") || $("chips").querySelector(".chip");
        focusRemoteTarget(target);
      }
      
      function cssEscape(value) {
        if (window.CSS && CSS.escape) return CSS.escape(value);
        return String(value).replace(/"/g, '\\"');
      }
      
      function moveFocus(key) {
        var current = document.activeElement;
        if (!isVisibleFocusable(current)) {
          focusRemoteTarget(focusables()[0]);
          return;
        }
        var items = focusables();
        var curRect = current.getBoundingClientRect();
        var cx = curRect.left + curRect.width / 2;
        var cy = curRect.top + curRect.height / 2;
        var best = null;
        var bestScore = Infinity;
        items.forEach(function (el) {
          if (el === current) return;
          var r = el.getBoundingClientRect();
          var x = r.left + r.width / 2;
          var y = r.top + r.height / 2;
          var dx = x - cx;
          var dy = y - cy;
          if (key === "ArrowLeft" && dx >= -4) return;
          if (key === "ArrowRight" && dx <= 4) return;
          if (key === "ArrowUp" && dy >= -4) return;
          if (key === "ArrowDown" && dy <= 4) return;
          var primary = key === "ArrowLeft" || key === "ArrowRight" ? Math.abs(dx) : Math.abs(dy);
          var secondary = key === "ArrowLeft" || key === "ArrowRight" ? Math.abs(dy) : Math.abs(dx);
          var score = primary * 4 + secondary;
          if (score < bestScore) {
            bestScore = score;
            best = el;
          }
        });
        if (best) focusRemoteTarget(best);
      }
      
      // ==================== 事件绑定与初始化 ====================
      function bindEvents() {
        $("chips").addEventListener("click", function (event) {
          var btn = event.target.closest("[data-cat]");
          if (btn) switchCat(btn.dataset.cat);
        });
        $("grid").addEventListener("click", function (event) {
          var card = event.target.closest("[data-id]");
          if (!card) return;
          state.focusKey = card.dataset.key || "";
          saveSnapshot();
          openDetail(card.dataset.id);
        });
        $("moreBtn").addEventListener("click", loadMore);
        $("searchForm").addEventListener("submit", function (event) {
          event.preventDefault();
          doSearch($("searchInput").value);
          $("searchInput").blur();
          $("searchInput").setAttribute("readonly", "readonly");
        });
        $("searchInput").addEventListener("click", function () { $("searchInput").removeAttribute("readonly"); });
        $("searchInput").addEventListener("keydown", function (event) {
          if (event.key === "Enter") $("searchForm").dispatchEvent(new Event("submit", { cancelable: true }));
          if (event.key === "Escape" || event.key === "Backspace" && !$("searchInput").value) {
            $("searchInput").setAttribute("readonly", "readonly");
            $("searchInput").blur();
            restoreListFocus();
          }
        });
        $("closeDetailBtn").addEventListener("click", function () { closeDetail(false); });
        $("playerCloseBtn").addEventListener("click", closePlayer);
        
        document.addEventListener("keydown", function(event) {
          if (event.key === "Escape" && playerModal.classList.contains("active")) {
            closePlayer();
          }
        });
        
        document.addEventListener("focusin", function (event) {
          var el = event.target;
          if (el && el.dataset && el.dataset.key) state.focusKey = el.dataset.key;
        });
        
        document.addEventListener("keydown", function (event) {
          if (event.defaultPrevented) return;
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(event.key) >= 0) {
            if (!playerModal.classList.contains("active")) {
              event.preventDefault();
              moveFocus(event.key);
            }
          } else if (event.key === "Enter") {
            var active = document.activeElement;
            if (active && isVisibleFocusable(active) && active.tagName !== "INPUT") {
              event.preventDefault();
              active.click();
            } else if (active === $("searchInput") && $("searchInput").hasAttribute("readonly")) {
              event.preventDefault();
              $("searchInput").removeAttribute("readonly");
            }
          } else if (event.key === "Escape" || event.key === "Backspace") {
            if ($("detailSheet").classList.contains("active") && !playerModal.classList.contains("active")) {
              event.preventDefault();
              closeDetail(false);
            }
          }
        });
        
        window.addEventListener("popstate", function () {
          if (location.hash !== "#detail" && $("detailSheet").classList.contains("active")) closeDetail(true);
        });
        window.addEventListener("beforeunload", saveSnapshot);
      }
      
      function init() {
        renderChips();
        bindEvents();
        var restored = restoreSnapshot();
        if (!restored) {
          loadList(true);
        } else if (!state.items.length) {
          loadList(true);
        }
        if (location.hash === "#detail" && state.focusKey) {
          var id = state.focusKey.replace(/^vod-/, "");
          if (id) openDetail(id, { skipHistory: true });
        }
        setTimeout(restoreListFocus, 120);
      }
      
      init();
    })();
