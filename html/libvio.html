<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>LIBVIO · 流光幻影</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0c12;
            --bg-surface: #0f121b;
            --panel-rgb: 20, 24, 32;
            --panel: rgba(var(--panel-rgb), 0.68);
            --panel-soft: rgba(var(--panel-rgb), 0.5);
            --panel-strong: rgba(var(--panel-rgb), 0.86);
            --accent: #f5b642;
            --accent-glow: rgba(245, 182, 66, 0.35);
            --text-main: #f0f3fa;
            --text-sub: #9aa3b8;
            --text-muted: #5b637a;
            --line: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.45);
            --shadow-hover: 0 20px 32px rgba(0, 0, 0, 0.55);
            --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --card-radius: 20px;
            --panel-radius: 24px;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            scroll-behavior: smooth;
        }

        /* 动态光晕背景 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(245, 182, 66, 0.08), transparent 60%),
                        radial-gradient(circle at 85% 70%, rgba(100, 130, 240, 0.06), transparent 50%);
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.015"><path fill="none" d="M0 0L200 200M200 0L0 200" stroke="white" stroke-width="0.6"/><circle cx="100" cy="100" r="85" stroke="white" stroke-width="0.4" fill="none"/></svg>');
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px 40px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        body.detail-active .container {
            visibility: hidden;
            pointer-events: none;
        }

        /* 头部毛玻璃质感 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            padding: 12px 24px;
            background: rgba(12, 15, 24, 0.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 60px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 50px;
        }

        .nav-tab {
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }

        .nav-tab.active {
            background: var(--accent);
            color: #0a0c12;
            font-weight: 700;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .search-bar {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 6px;
            border-radius: 48px;
            backdrop-filter: blur(4px);
        }

        .search-input {
            background: rgba(20, 24, 34, 0.7);
            color: var(--text-main);
            border: 1px solid var(--line);
            padding: 8px 18px;
            border-radius: 40px;
            width: 200px;
            font-size: 0.85rem;
            transition: all 0.2s;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        .search-btn {
            background: var(--accent);
            color: #0a0c12;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .search-btn:hover {
            transform: scale(0.96);
            background: #ffc15e;
        }

        /* 卡片网格 */
        .vod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 22px;
            margin-top: 10px;
        }

        .vod-card {
            background: var(--panel-soft);
            backdrop-filter: blur(4px);
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-sm);
        }

        .vod-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(245, 182, 66, 0.5);
            box-shadow: var(--shadow-hover);
            background: rgba(32, 38, 52, 0.8);
        }

        .vod-card:active {
            transform: scale(0.98);
        }

        .vod-thumb-box {
            position: relative;
            width: 100%;
            padding-top: 140%;
            overflow: hidden;
            background: #0c0f18;
        }

        .vod-thumb {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .vod-card:hover .vod-thumb {
            transform: scale(1.05);
        }

        .vod-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 30px;
            border: 0.5px solid var(--accent);
            z-index: 2;
        }

        .vod-remarks {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(2px);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .vod-title {
            padding: 10px 8px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #f0f2f9;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            padding: 10px 0;
        }

        .page-btn {
            background: var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            color: var(--text-main);
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .page-btn:hover {
            background: var(--accent);
            color: #0a0c12;
            transform: scale(0.96);
        }

        .page-text {
            font-size: 0.85rem;
            color: var(--text-sub);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 60px;
        }

        /* 详情面板 高级毛玻璃 */
        .layer-sheet {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 12, 0.75);
            backdrop-filter: blur(18px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(18px); }
        }

        .sheet-body {
            background: rgba(14, 18, 26, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 182, 66, 0.3);
            border-radius: 36px;
            width: 100%;
            max-width: 960px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);
            transition: all 0.2s;
        }

        .sheet-body::-webkit-scrollbar {
            width: 4px;
        }

        .sheet-main {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .sheet-poster {
            width: 140px;
            height: 196px;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }

        .sheet-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sheet-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sheet-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(120deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        .sheet-close {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--line);
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .sheet-close:hover {
            background: var(--accent);
            color: #0a0c12;
            border-color: var(--accent);
        }

        .sheet-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.6;
            max-height: 130px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .part-title {
            font-size: 1.1rem;
            font-weight: 700;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            margin: 16px 0 12px 0;
            color: var(--text-main);
        }

        .episode-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .episode-item {
            background: rgba(30, 36, 48, 0.7);
            backdrop-filter: blur(4px);
            color: var(--text-main);
            border: 1px solid var(--line);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .episode-item:hover {
            background: var(--accent);
            color: #0a0c12;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .disk-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(25, 30, 42, 0.7);
            border: 1px solid var(--line);
            padding: 12px 18px;
            border-radius: 48px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .disk-item:hover {
            background: rgba(245, 182, 66, 0.2);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .disk-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .disk-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6b7280;
            transition: 0.1s;
        }

        .disk-status.ok { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .disk-status.bad { background: #e74c3c; }
        .disk-status.locked { background: #f1c40f; }

        .status-msg {
            text-align: center;
            padding: 50px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* 焦点样式 (保持可访问性) */
        .focusable:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
            transform: scale(1.02);
            transition: 0.1s;
        }

        /* 响应式 */
        @media (max-width: 720px) {
            .container {
                padding: 16px;
            }
            .header {
                border-radius: 32px;
                padding: 12px 18px;
            }
            .logo {
                font-size: 1.4rem;
            }
            .vod-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 14px;
            }
            .sheet-body {
                padding: 20px;
            }
            .sheet-title {
                font-size: 1.5rem;
            }
            .sheet-poster {
                width: 110px;
                height: 154px;
            }
            .nav-tab {
                padding: 4px 14px;
                font-size: 0.75rem;
            }
            .search-input {
                width: 140px;
            }
        }

        @media (min-width: 1400px) {
            .vod-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        /* 加载动画 */
        .status-msg.loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .status-msg.loading::before {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid rgba(245, 182, 66, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header">
        <div class="logo">LIBVIO</div>
        <div class="nav-tabs" id="categoryBox">
            <div class="nav-tab focusable active" data-id="home">首页</div>
            <div class="nav-tab focusable" data-id="1">电影</div>
            <div class="nav-tab focusable" data-id="2">剧集</div>
            <div class="nav-tab focusable" data-id="4">番剧</div>
            <div class="nav-tab focusable" data-id="15">日韩</div>
            <div class="nav-tab focusable" data-id="16">欧美</div>
        </div>
        <div class="search-bar">
            <input type="text" id="keywords" class="search-input focusable" placeholder="搜索影片...">
            <button id="searchButton" class="search-btn focusable">搜 索</button>
        </div>
    </div>

    <div class="vod-grid" id="vodGrid"></div>

    <div class="pagination" id="pageBox">
        <button id="btnPrev" class="page-btn focusable">上一页</button>
        <span id="txtPage" class="page-text">第 1 页</span>
        <button id="btnNext" class="page-btn focusable">下一页</button>
    </div>
</div>

<div class="layer-sheet" id="detailSheet" style="display: none;">
    <div class="sheet-body">
        <div class="sheet-main">
            <img id="detailImg" class="sheet-poster" src="" alt="">
            <div class="sheet-details">
                <div class="sheet-title-row">
                    <h2 id="sheetTitle" class="sheet-title"></h2>
                    <button class="sheet-close focusable" id="btnCloseSheet">关 闭</button>
                </div>
                <div id="sheetDesc" class="sheet-desc"></div>
            </div>
        </div>
        <div id="sourceContainer"></div>
    </div>
</div>

<script>
    const HOST = 'https://www.libvio.run';
    let currentType = 'home';
    let currentIdx = 1;
    let queryWord = '';
    let preFocusNode = null;

    function verifySdk() {
        if (window.fongmiBridge || window.fm || window.fongmi) {
            document.documentElement.classList.add("fm-native");
        }
    }

    window.addEventListener("fmsdk", verifySdk);
    document.addEventListener("DOMContentLoaded", () => {
        verifySdk();
        requestList();
    });

    async function loadHtml(uri) {
        const url = uri.startsWith('http') ? uri : HOST + uri;
        if (window.fm && window.fm.req) {
            const resp = await fm.req(url, { method: 'GET', responseType: 'text', timeout: 12 });
            if (!resp.ok) throw new Error(`Status ${resp.status}`);
            return resp.body;
        }
        const resp = await fetch(url);
        return await resp.text();
    }

    function safeImg(url) {
        if (!url) return '';
        if (url.startsWith('//')) url = 'https:' + url;
        if (window.fm && window.fm.res) {
            return fm.res(url, { headers: { 'Referer': HOST } });
        }
        return url;
    }

    function parseVods(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const items = [];
        const blocks = doc.querySelectorAll('.stui-vodlist__box');
        
        blocks.forEach(b => {
            const node = b.querySelector('a.stui-vodlist__thumb');
            if (node) {
                let img = node.getAttribute('data-original') || node.getAttribute('style') || '';
                if (img.includes('url(')) {
                    const match = img.match(/url\(['"]?(.*?)['"]?\)/);
                    if (match) img = match[1];
                }
                const score = b.querySelector('.pic-tag-top');
                const remark = b.querySelector('.pic-text');
                items.push({
                    title: node.getAttribute('title') || b.querySelector('.title a')?.innerText || '',
                    href: node.getAttribute('href'),
                    pic: img,
                    tag: score ? score.innerText.trim() : '',
                    note: remark ? remark.innerText.trim() : ''
                });
            }
        });
        return items;
    }

    function parseMeta(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const title = doc.querySelector('h1.title')?.innerText || '';
        const poster = doc.querySelector('.vod-poster img')?.getAttribute('data-original') || '';
        const desc = doc.querySelector('.vod-desc .detail-sketch')?.innerText || '';
        
        const lines = [];
        const clouds = [];

        doc.querySelectorAll('.playlist-panel:not(.netdisk-panel)').forEach(p => {
            const label = p.querySelector('h3')?.innerText || '播放资源';
            const eps = [];
            p.querySelectorAll('.stui-content__playlist li a').forEach(a => {
                eps.push({ name: a.innerText.trim(), href: a.getAttribute('href') });
            });
            if (eps.length > 0) lines.push({ name: label, data: eps });
        });

        doc.querySelectorAll('.netdisk-panel .netdisk-item').forEach(p => {
            const tag = p.querySelector('.netdisk-name')?.innerText || '网盘下载';
            const link = p.getAttribute('href');
            if (link) {
                let type = 'http';
                if (link.includes('quark.cn')) type = 'quark';
                else if (link.includes('uc.cn')) type = 'uc';
                else if (link.includes('aliyun.com')) type = 'aliyun';
                else if (link.includes('baidu.com')) type = 'baidu';
                clouds.push({ name: tag, url: link, type: type });
            }
        });

        return { title, poster, desc, lines, clouds };
    }

    function parseMediaLink(html) {
        const match = html.match(/var player_aaaa\s*=\s*(\{.*?\})/);
        if (match && match[1]) {
            try {
                const config = JSON.parse(match[1]);
                return config.url || '';
            } catch (e) {}
        }
        return '';
    }

    async function requestList() {
        const grid = document.getElementById('vodGrid');
        grid.innerHTML = '<div class="status-msg loading">加载中...</div>';
        
        let path = '/';
        if (currentType === 'search') {
            path = `/search/-------------.html?wd=${encodeURIComponent(queryWord)}`;
            document.getElementById('pageBox').style.display = 'none';
        } else if (currentType === 'home') {
            path = '/';
            document.getElementById('pageBox').style.display = 'none';
        } else {
            path = `/type/${currentType}-${currentIdx}.html`;
            document.getElementById('pageBox').style.display = 'flex';
            document.getElementById('txtPage').innerText = `第 ${currentIdx} 页`;
        }

        try {
            const html = await loadHtml(path);
            const items = parseVods(html);
            renderGrid(items);
        } catch (e) {
            grid.innerHTML = `<div class="status-msg">数据加载失败: ${e.message}</div>`;
        }
    }

    function renderGrid(items) {
        const grid = document.getElementById('vodGrid');
        grid.innerHTML = '';
        if (items.length === 0) {
            grid.innerHTML = '<div class="status-msg">✨ 没有找到相关资源</div>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'vod-card focusable';
            card.tabIndex = 0;
            
            let html = `<div class="vod-thumb-box"><img class="vod-thumb" src="${safeImg(item.pic)}" loading="lazy" onerror="this.style.opacity=0.3">`;
            if (item.tag && item.tag !== '0.0') html += `<div class="vod-tag">${item.tag}</div>`;
            if (item.note) html += `<div class="vod-remarks">${item.note}</div>`;
            html += `</div><div class="vod-title">${item.title}</div>`;
            
            card.innerHTML = html;
            card.onclick = () => openDetails(item.href);
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') openDetails(item.href);
            });
            grid.appendChild(card);
        });
    }

    async function openDetails(url) {
        preFocusNode = document.activeElement;
        document.body.classList.add('detail-active');
        
        const sheet = document.getElementById('detailSheet');
        sheet.style.display = 'flex';
        
        const title = document.getElementById('sheetTitle');
        const desc = document.getElementById('sheetDesc');
        const img = document.getElementById('detailImg');
        const box = document.getElementById('sourceContainer');
        
        title.innerText = '加载详情...';
        desc.innerText = '';
        img.src = '';
        box.innerHTML = '<div class="status-msg loading">读取数据中...</div>';

        document.getElementById('btnCloseSheet').focus();

        try {
            const html = await loadHtml(url);
            const meta = parseMeta(html);

            title.innerText = meta.title || '未知影片';
            desc.innerText = meta.desc || '暂无简介';
            img.src = safeImg(meta.poster);
            box.innerHTML = '';

            if (meta.clouds.length > 0) {
                const part = document.createElement('div');
                part.className = 'play-group';
                part.innerHTML = `<div class="part-title">📀 网盘下载</div>`;
                const list = document.createElement('div');
                
                meta.clouds.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'disk-item focusable';
                    item.tabIndex = 0;
                    const shortId = btoa(c.url).replace(/[=+/]/g, '');
                    item.innerHTML = `<div class="disk-info"><div class="disk-status" id="pan_${shortId}"></div><span>${c.name} [${c.type.toUpperCase()}]</span></div>`;
                    
                    const triggerPlay = () => {
                        if (window.fm && window.fm.pan && window.fm.pan.play) {
                            fm.pan.play({ type: c.type, url: c.url, title: meta.title });
                        } else {
                            window.open(c.url);
                        }
                    };
                    item.onclick = triggerPlay;
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter') triggerPlay(); });
                    list.appendChild(item);
                });
                part.appendChild(list);
                box.appendChild(part);
                triggerPanCheck(meta.clouds);
            }

            meta.lines.forEach(line => {
                const part = document.createElement('div');
                part.className = 'play-group';
                part.innerHTML = `<div class="part-title">🎬 ${line.name}</div>`;
                const list = document.createElement('div');
                list.className = 'episode-grid';
                
                line.data.forEach(ep => {
                    const item = document.createElement('div');
                    item.className = 'episode-item focusable';
                    item.tabIndex = 0;
                    item.innerText = ep.name;
                    
                    const startPlay = async () => {
                        const originalText = item.innerText;
                        item.innerText = '⏳ 解析中';
                        try {
                            const phtml = await loadHtml(ep.href);
                            const streamUrl = parseMediaLink(phtml);
                            item.innerText = originalText;
                            if (streamUrl) {
                                if (window.fm && window.fm.play) {
                                    fm.play(streamUrl, `${meta.title} - ${ep.name}`, {
                                        headers: {
                                            'Referer': HOST + '/',
                                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                                        }
                                    });
                                } else {
                                    alert(`播放链接已获取:\n${streamUrl}`);
                                }
                            } else {
                                alert('未找到有效的媒体直链');
                            }
                        } catch (err) {
                            item.innerText = originalText;
                        }
                    };
                    item.onclick = startPlay;
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter') startPlay(); });
                    list.appendChild(item);
                });
                part.appendChild(list);
                box.appendChild(part);
            });
            if (meta.clouds.length === 0 && meta.lines.length === 0) {
                box.innerHTML = '<div class="status-msg">暂时没有可播放的资源</div>';
            }
        } catch (e) {
            box.innerHTML = `<div class="status-msg">加载失败: ${e.message}</div>`;
        }
    }

    function closeDetails() {
        document.body.classList.remove('detail-active');
        document.getElementById('detailSheet').style.display = 'none';
        if (preFocusNode) {
            preFocusNode.focus({ preventScroll: true });
            preFocusNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    document.getElementById('btnCloseSheet').onclick = closeDetails;
    document.getElementById('detailSheet').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailSheet')) closeDetails();
    });

    async function triggerPanCheck(clouds) {
        if (!window.fm || !window.fm.config || !window.fm.pan || !window.fm.pan.check) return;
        try {
            const conf = await fm.config();
            if (!conf.driveCheck) return;

            const targets = clouds.map(c => ({ type: c.type, url: c.url, password: "" }))
.filter(t => ['quark', 'uc', 'aliyun', 'baidu'].includes(t.type));
            if (targets.length === 0) return;

            const resp = await fm.pan.check(targets);
            if (resp && resp.results) {
                resp.results.forEach(r => {
                    const dot = document.getElementById(`pan_${btoa(r.url).replace(/[=+/]/g, '')}`);
                    if (dot) dot.className = `disk-status ${r.state}`;
                });
            }
        } catch (e) {}
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            currentType = e.target.getAttribute('data-id');
            currentIdx = 1;
            requestList();
        });
    });

    document.getElementById('btnPrev').onclick = () => {
        if (currentIdx > 1) {
            currentIdx--;
            requestList();
        }
    };
    document.getElementById('btnNext').onclick = () => {
        currentIdx++;
        requestList();
    };

    function startSearch() {
        const val = document.getElementById('keywords').value.trim();
        if (!val) return;
        queryWord = val;
        currentType = 'search';
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        requestList();
    }
    document.getElementById('searchButton').onclick = startSearch;
    document.getElementById('keywords').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startSearch();
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 27 || e.keyCode === 8) {
            if (document.body.classList.contains('detail-active')) {
                closeDetails();
                e.preventDefault();
                e.stopImmediatePropagation();
            } else if (window.fm && window.fm.back) {
                fm.back();
            }
        }
    });
</script>

</body>
</html>
